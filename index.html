<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Liquid Figure Editor</title>
    <style>
      .boot-loading { min-height: 100dvh; display: grid; place-content: center; gap: 14px; text-align: center; background: #000; color: #f2edf8; font-family: system-ui, sans-serif; }
      .boot-loading p { margin: 0; }
      .boot-loading-quote { max-width: min(440px, 86vw); font-size: 24px; letter-spacing: .045em; animation: boot-breathe 3s ease-in-out infinite; }
      .boot-loading small { color: #9b91ab; font-size: 10px; letter-spacing: .15em; }
      .boot-loading-dots { display: flex; justify-content: center; gap: 4px; font-size: 24px; }
      .boot-loading-dots span { animation: boot-dot 1.2s ease-in-out infinite; }
      .boot-loading-dots span:nth-child(2) { animation-delay: .16s; }
      .boot-loading-dots span:nth-child(3) { animation-delay: .32s; }
      @keyframes boot-dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
      @keyframes boot-breathe { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-loading-quote, .boot-loading-dots span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-label="Loading figure">
        <p class="boot-loading-quote">Spiral out. Keep going.</p>
        <small>TOOL · Lateralus</small>
        <span class="boot-loading-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
